services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 工作人员口令：生产部署务必修改（也可用 .env 文件覆盖）
      STAFF_TOKEN: ${STAFF_TOKEN:-staff-demo-token}
      # 会话签名密钥：生产部署务必修改
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # 交还码有效期（分钟）
      CODE_TTL_MINUTES: ${CODE_TTL_MINUTES:-30}
      # 首次启动写入演示数据：1 开启 / 0 关闭
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - lostfound-data:/data
    restart: unless-stopped

volumes:
  lostfound-data:
